<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How a task moves through Padakan</title>
  <desc>A task starts at the plan gate, gets its tools from the capability resolver, passes the cost gate, is built in its own sandbox, passes the verification gates, ships as a PR with evidence, is merged by the orchestrator and deployed behind a canary. The monitor loop watches production and turns new defects into tasks. Unclear gates and over-budget steps go to a human; every step is written to the signed audit trail.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <path id="flow" d="M105 135 H1190 V425 H285 V135"/>
    <path id="esc" d="M845 182 V246"/>
    <path id="cost" d="M455 182 V212"/>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .box{stroke-width:2}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .c{font-size:11px;fill:#64748b}
      .n{font-size:11px;font-weight:800;fill:#fff}
      .line{fill:none;stroke:#94a3b8;stroke-width:2}
      .audit{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-18}}
      .blink{animation:blink 2.4s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
      .spin{transform-origin:645px 140px;animation:spin 4s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){.audit,.blink,.spin{animation:none}}
    </style>
  </defs>

  <rect width="1280" height="640" rx="18" fill="#f8fafc"/>
  <text x="30" y="36" font-size="20" font-weight="800" fill="#0f172a">How work moves through Padakan</text>
  <text x="30" y="58" class="s">Plan once, then every task flows on its own. Dots are tasks; red goes to a human; amber is a cost question.</text>

  <!-- connectors (under the tokens and boxes) -->
  <path class="line" d="M180 135 H208" marker-end="url(#ar)"/>
  <path class="line" d="M360 135 H388" marker-end="url(#ar)"/>
  <path class="line" d="M520 135 H548" marker-end="url(#ar)"/>
  <path class="line" d="M740 135 H768" marker-end="url(#ar)"/>
  <path class="line" d="M920 135 H948" marker-end="url(#ar)"/>
  <path class="line" d="M1090 135 H1118" marker-end="url(#ar)"/>
  <path class="line" d="M1190 180 V378" marker-end="url(#ar)"/>
  <path class="line" d="M1100 425 H1052" marker-end="url(#ar)"/>
  <path class="line" d="M880 425 H822" marker-end="url(#ar)"/>
  <path class="line" d="M620 425 H285 V184" marker-end="url(#ar)"/>
  <text x="452" y="446" class="c" text-anchor="middle">new task from production</text>
  <path d="M845 182 V246" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <path d="M455 182 V212" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arA)"/>

  <!-- tasks moving (drawn under the boxes, so they appear between stages) -->
  <g filter="url(#glow)">
    <circle r="8" fill="#2563eb"><animateMotion dur="15s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion></circle>
    <circle r="8" fill="#16a34a"><animateMotion dur="15s" begin="-5s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <circle r="8" fill="#9333ea"><animateMotion dur="15s" begin="-10s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <circle r="7" fill="#dc2626"><animateMotion dur="5s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.4;1" calcMode="linear"><mpath href="#esc"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.5;1" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle r="7" fill="#d97706"><animateMotion dur="7s" begin="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.3;1" calcMode="linear"><mpath href="#cost"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.4;1" dur="7s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 1 plan gate -->
  <rect class="box" x="30" y="90" width="150" height="90" rx="12" fill="#fffbeb" stroke="#d97706"/>
  <circle cx="48" cy="90" r="11" fill="#d97706"/><text x="48" y="94" class="n" text-anchor="middle">1</text>
  <text x="105" y="128" class="t" text-anchor="middle">Plan gate</text>
  <text x="105" y="147" class="s" text-anchor="middle">human, once</text>
  <text x="105" y="163" class="s" text-anchor="middle">PRD · tasks · budget</text>
  <text x="105" y="200" class="c" text-anchor="middle">the only approval</text>

  <!-- 2 resolver -->
  <rect class="box" x="210" y="90" width="150" height="90" rx="12" fill="#fdf2f8" stroke="#db2777"/>
  <circle cx="228" cy="90" r="11" fill="#db2777"/><text x="228" y="94" class="n" text-anchor="middle">2</text>
  <text x="285" y="128" class="t" text-anchor="middle">Resolver</text>
  <text x="285" y="147" class="s" text-anchor="middle">a model picks the tools</text>
  <text x="285" y="163" class="s" text-anchor="middle">Nemotron or local</text>

  <!-- 3 cost gate -->
  <rect x="380" y="214" width="150" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="455" y="233" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">over budget?</text>
  <text x="455" y="249" font-size="11" fill="#92400e" text-anchor="middle">decision report → human</text>
  <rect class="box" x="390" y="90" width="130" height="90" rx="12" fill="#fffbeb" stroke="#d97706"/>
  <circle cx="408" cy="90" r="11" fill="#d97706"/><text x="408" y="94" class="n" text-anchor="middle">3</text>
  <text x="455" y="128" class="t" text-anchor="middle">Cost gate</text>
  <text x="455" y="147" class="s" text-anchor="middle">estimate vs</text>
  <text x="455" y="163" class="s" text-anchor="middle">budget left</text>
  <circle cx="507" cy="104" r="5" fill="#d97706" class="blink"/>

  <!-- 4 tree -->
  <rect class="box" x="550" y="90" width="190" height="90" rx="12" fill="#fdf4ff" stroke="#a21caf"/>
  <circle cx="568" cy="90" r="11" fill="#a21caf"/><text x="568" y="94" class="n" text-anchor="middle">4</text>
  <text x="645" y="112" class="t" text-anchor="middle">Sandbox tree</text>
  <g class="spin"><circle cx="645" cy="140" r="19" fill="none" stroke="#e9d5ff" stroke-width="4"/><path d="M645 121 A19 19 0 0 1 664 140" fill="none" stroke="#a21caf" stroke-width="4" stroke-linecap="round"/></g>
  <text x="645" y="144" font-size="9.5" font-weight="700" fill="#86198f" text-anchor="middle">loop</text>
  <text x="645" y="172" class="s" text-anchor="middle">plan · build · review · test</text>
  <text x="645" y="200" class="c" text-anchor="middle">Devin session or Daytona</text>

  <!-- 5 gates -->
  <rect class="box" x="770" y="90" width="150" height="90" rx="12" fill="#ecfdf5" stroke="#059669"/>
  <circle cx="788" cy="90" r="11" fill="#059669"/><text x="788" y="94" class="n" text-anchor="middle">5</text>
  <text x="845" y="122" class="t" text-anchor="middle">Gates</text>
  <text x="845" y="141" class="s" text-anchor="middle">proven twice</text>
  <text x="845" y="157" class="s" text-anchor="middle">no regressions</text>
  <text x="845" y="173" class="s" text-anchor="middle">diff · documents</text>
  <text x="905" y="112" font-size="14" fill="#059669" class="blink">✓</text>

  <!-- escalation -->
  <rect x="770" y="248" width="150" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="845" y="270" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">unclear? escalate</text>
  <text x="845" y="287" font-size="11" fill="#991b1b" text-anchor="middle">a ticket for a human</text>

  <!-- 6 PR + evidence -->
  <rect class="box" x="950" y="90" width="140" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
  <circle cx="968" cy="90" r="11" fill="#7c3aed"/><text x="968" y="94" class="n" text-anchor="middle">6</text>
  <text x="1020" y="122" class="t" text-anchor="middle">PR + evidence</text>
  <text x="1020" y="141" class="s" text-anchor="middle">video · architecture</text>
  <text x="1020" y="157" class="s" text-anchor="middle">files · tests and CI</text>
  <text x="1020" y="200" class="c" text-anchor="middle">re-checked at source</text>

  <!-- 7 orchestrator -->
  <rect class="box" x="1120" y="90" width="140" height="90" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <circle cx="1138" cy="90" r="11" fill="#2563eb"/><text x="1138" y="94" class="n" text-anchor="middle">7</text>
  <text x="1190" y="122" class="t" text-anchor="middle">Orchestrator</text>
  <text x="1190" y="141" class="s" text-anchor="middle">decides and</text>
  <text x="1190" y="157" class="s" text-anchor="middle">merges, one at</text>
  <text x="1190" y="173" class="s" text-anchor="middle">a time</text>

  <!-- 8 gated deploy -->
  <rect class="box" x="1100" y="380" width="160" height="90" rx="12" fill="#ecfdf5" stroke="#059669"/>
  <circle cx="1118" cy="380" r="11" fill="#059669"/><text x="1118" y="384" class="n" text-anchor="middle">8</text>
  <text x="1180" y="414" class="t" text-anchor="middle">Gated deploy</text>
  <text x="1180" y="433" class="s" text-anchor="middle">flag → canary</text>
  <text x="1180" y="449" class="s" text-anchor="middle">SLO slips → rollback</text>
  <text x="1180" y="490" class="c" text-anchor="middle">undoes itself</text>

  <!-- 9 production -->
  <rect class="box" x="880" y="380" width="170" height="90" rx="12" fill="#f1f5f9" stroke="#64748b"/>
  <circle cx="898" cy="380" r="11" fill="#64748b"/><text x="898" y="384" class="n" text-anchor="middle">9</text>
  <text x="965" y="420" class="t" text-anchor="middle">Production</text>
  <text x="965" y="440" class="s" text-anchor="middle">the change is live</text>
  <circle cx="1030" cy="396" r="5" fill="#16a34a" class="blink"/>

  <!-- 10 monitor -->
  <rect class="box" x="620" y="380" width="200" height="90" rx="12" fill="#ecfeff" stroke="#0891b2"/>
  <circle cx="638" cy="380" r="11" fill="#0891b2"/><text x="638" y="384" class="n" text-anchor="middle">10</text>
  <text x="720" y="414" class="t" text-anchor="middle">Monitor loop</text>
  <text x="720" y="433" class="s" text-anchor="middle">logs → clusters → triage</text>
  <text x="720" y="449" class="s" text-anchor="middle">fixable defect → new task</text>
  <text x="720" y="490" class="c" text-anchor="middle">every N minutes</text>

  <!-- audit trail -->
  <rect x="30" y="540" width="1220" height="70" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <path class="audit" d="M50 565 H1230"/>
  <text x="640" y="592" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Audit trail: every step above is hash-chained, signed and replayable · every document is Open Knowledge Format</text>
</svg>
