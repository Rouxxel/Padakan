# Padakan's own checks: the test suite (zero dependencies) and the plugin's documents.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Templates are valid OKF
        run: node core/okf.mjs --template templates
